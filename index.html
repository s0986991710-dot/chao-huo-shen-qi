<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16834b">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<title>抄貨神器</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:#f3f7f4;color:#183126}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{background:#16834b;color:white;padding:18px 18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:26px;margin:0 0 5px}.sub{opacity:.9;font-size:14px}
main{padding:16px 14px 100px}.card{background:white;border:1px solid #e5ece7;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}
label{font-size:14px;font-weight:700;display:block;margin-bottom:7px}
select,input{width:100%;font-size:17px;border:1px solid #cfdad3;border-radius:12px;padding:13px;background:#fff}
.search{margin:8px 0 12px}
.product{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1ee}
.product:last-child{border-bottom:0}.info{flex:1;min-width:0}.name{font-weight:700;font-size:16px}.spec{font-size:13px;color:#6c7771;margin-top:3px}.price{font-weight:700;color:#16834b;margin-top:5px}
.qty{display:flex;align-items:center;gap:7px}.qty button,.primary,.secondary{border:0;border-radius:11px;font-size:17px;font-weight:700;padding:10px 14px}.qty button{background:#e8f5ed;color:#16834b;min-width:42px}.qty input{width:58px;text-align:center;padding:9px}.primary{width:100%;background:#16834b;color:white;padding:15px;margin-top:8px}.secondary{width:100%;background:#eef3ef;color:#244337;padding:13px;margin-top:8px}
.hidden{display:none}.count{font-size:13px;color:#6a756f;margin:8px 0}.empty{text-align:center;color:#78827d;padding:35px 10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.total{font-size:18px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dfe8e2;padding:9px;display:flex;justify-content:center;z-index:10}.nav button{border:0;background:transparent;font-size:13px;color:#4d5d54;margin:0 18px}.nav b{color:#16834b}.success{text-align:center;padding:45px 20px}.check{font-size:64px;color:#16834b}.order{font-size:14px;line-height:1.7}.tag{display:inline-block;background:#e8f5ed;color:#16834b;border-radius:20px;padding:4px 9px;font-size:12px}
</style>
</head>
<body>
<div class="app">
<header><h1>抄貨神器</h1><div class="sub">手機快速抄貨・送單</div></header>
<main>
<section id="home">
<div class="card">
<label>選擇客戶</label>
<select id="customer"><option>測試客戶（客戶資料待後補）</option></select>
<label style="margin-top:14px">業務姓名</label>
<input id="sales" placeholder="請輸入業務姓名">
<button class="primary" onclick="start()">開始抄貨</button>
</div>
<div class="card"><div class="row"><b>商品資料</b><span class="tag" id="productCount"></span></div><div class="count">目前先使用你的商品 Excel；客戶資料之後再加入。</div></div>
</section>

<section id="shop" class="hidden">
<div class="card">
<div class="row"><b>正在抄貨</b><span class="tag" id="cartCount">0 項</span></div>
<input class="search" id="search" placeholder="🔍 搜尋品名或輸入條碼" oninput="renderProducts()"><button class="secondary" type="button" onclick="openScanner()">📷 開啟相機掃條碼</button><div id="scannerBox" class="card hidden" style="padding:10px;margin-top:10px"><div id="reader" style="width:100%"></div><button class="secondary" type="button" onclick="closeScanner()">關閉掃描</button></div>
<div id="products"></div>
</div>
<div class="card">
<div class="row"><span class="total">已選商品 <span id="selectedCount">0</span> 項</span><span id="totalQty">0 件</span></div>
<button class="primary" onclick="confirmOrder()">查看抄貨單</button>
<button class="secondary" onclick="saveDraft()">暫存</button>
</div>
</section>

<section id="confirm" class="hidden">
<div class="card"><b>確認抄貨單</b><div id="confirmList" style="margin-top:8px"></div></div>
<button class="primary" onclick="submitOrder()">送出抄貨單</button>
<button class="secondary" onclick="show('shop')">返回修改</button>
</section>

<section id="success" class="hidden">
<div class="card success"><div class="check">✓</div><h2>抄貨單已送出</h2><p>公司端已收到這張抄貨單。</p><button class="primary" onclick="newOrder()">開始下一張</button></div>
</section>

<section id="admin" class="hidden">
<div class="card"><div class="row"><b>公司端・抄貨單</b><span class="tag" id="orderCount">0 張</span></div></div>
<div id="orders"></div>
</section>
</main>
<div class="nav">
<button onclick="show('home')">🏠 首頁</button>
<button onclick="show('shop')">🛒 抄貨</button>
<button onclick="showAdmin()">📋 公司端</button>
</div>
</div>

    alert('掃碼功能載入失敗，請確認手機有網路後重新整理頁面。');
    return;
  }
  scanner = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 280, height: 140 },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
    ]
  };
  scanner.start(
    { facingMode: "environment" },
    config,
    (decodedText) => {
      document.getElementById('search').value = decodedText;
      renderProducts();
      closeScanner();
    },
    () => {}
  ).catch(err => {
    alert('無法開啟相機。請允許瀏覽器使用相機，並確認網址是 https:// 開頭。');
    closeScanner();
  });
}
function closeScanner(){
  const box=document.getElementById('scannerBox');
  if(scanner){
    scanner.stop().then(()=>{ scanner.clear(); scanner=null; }).catch(()=>{ scanner=null; });
  }
  box.classList.add('hidden');
}

function show(id){
  ['home','shop','confirm','success','admin'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  if(id==='shop') renderProducts();
  if(id==='confirm') renderConfirm();
}
function start(){
  if(draft){cart=draft.cart||{}; document.getElementById('sales').value=draft.sales||'';}
  show('shop');
}
function renderProducts(){
  const q=(document.getElementById('search')?.value||'').trim().toLowerCase();
  const list=PRODUCTS.filter(p=>(p.name+p.spec+p.barcode).toLowerCase().includes(q)).slice(0,80);
  const el=document.getElementById('products');
  el.innerHTML=list.length?list.map((p,i)=>`
    <div class="product">
      <div class="info"><div class="name">${esc(p.name)}</div><div class="spec">${esc(p.spec)} ${p.barcode?'・'+esc(p.barcode):''}</div><div class="price">售價 ${p.price==null?'—':'$'+p.price}</div></div>
      <div class="qty"><button onclick="change('${key(p)}',-1)">−</button><input value="${cart[key(p)]||0}" inputmode="numeric" onchange="setQty('${key(p)}',this.value)"><button onclick="change('${key(p)}',1)">＋</button></div>
    </div>`).join(''):'<div class="empty">找不到商品</div>';
  updateSummary();
}
function key(p){return encodeURIComponent(p.barcode+'|'+p.name+'|'+p.spec)}
function find(k){const raw=decodeURIComponent(k), [b,n,s]=raw.split('|'); return PRODUCTS.find(p=>p.barcode===b&&p.name===n&&p.spec===s)}
function change(k,d){setQty(k,(cart[k]||0)+d)}
function setQty(k,v){v=Math.max(0,parseInt(v)||0); if(v) cart[k]=v; else delete cart[k]; localStorage.setItem('cart',JSON.stringify(cart)); renderProducts()}
function updateSummary(){let keys=Object.keys(cart);let q=keys.reduce((a,k)=>a+(cart[k]||0),0);document.getElementById('cartCount').textContent=keys.length+' 項';document.getElementById('selectedCount').textContent=keys.length;document.getElementById('totalQty').textContent=q+' 件'}
function confirmOrder(){
 if(!Object.keys(cart).length){alert('請先輸入至少一項商品數量');return}
 renderConfirm();show('confirm')
}
function renderConfirm(){
 const el=document.getElementById('confirmList'); const keys=Object.keys(cart);
 el.innerHTML=keys.map(k=>{const p=find(k);return `<div class="product"><div class="info"><div class="name">${esc(p.name)}</div><div class="spec">${esc(p.spec)}</div></div><b>x ${cart[k]}</b></div>`}).join('');
}
function saveDraft(){draft={cart,sales:document.getElementById('sales')?.value||'',savedAt:new Date().toISOString()};localStorage.setItem('draft',JSON.stringify(draft));alert('已暫存，可以稍後繼續抄貨。')}
function submitOrder(){
 const items=Object.keys(cart).map(k=>{const p=find(k);return {...p,quantity:cart[k]}}); 
 const order={id:'ORD-'+Date.now(),customer:document.getElementById('customer').value,salesperson:document.getElementById('sales').value||'未填寫',createdAt:new Date().toLocaleString('zh-TW'),items};
 orders.unshift(order);localStorage.setItem('orders',JSON.stringify(orders));cart={};draft=null;localStorage.removeItem('cart');localStorage.removeItem('draft');show('success');
}
function newOrder(){document.getElementById('search').value='';show('shop')}
function showAdmin(){renderOrders();show('admin')}
function renderOrders(){
 document.getElementById('orderCount').textContent=orders.length+' 張';
 const el=document.getElementById('orders');
 el.innerHTML=orders.length?orders.map(o=>`<div class="card order"><b>${esc(o.customer)}</b> <span class="tag">${esc(o.salesperson)}</span><br>${esc(o.createdAt)}<br>商品 ${o.items.length} 項・總數量 ${o.items.reduce((a,x)=>a+x.quantity,0)}<details><summary>查看明細</summary>${o.items.map(x=>`${esc(x.name)}｜${esc(x.spec)}｜x ${x.quantity}`).join('<br>')}</details></div>`).join(''):'<div class="empty">尚無送出的抄貨單</div>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body></html>
